[pytest]
# Third-party deprecation and solver notices that are not about this project's code (EasyOCR's use of torch
# quantization, Starlette's test client, a scikit-learn solver option). Filtered by message so the project's own
# warnings, such as Pillow's DecompressionBombWarning from the 40-megapixel intake test, stay visible.
filterwarnings =
    ignore:.*torch.ao.quantization is deprecated.*
    ignore:.*quantize_per_tensor.*
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*
    ignore:.*Unknown solver options.*
    ignore:.*pin_memory.*
    ignore:.*torch.jit.script.*is deprecated.*

# These tests read the project's private evaluation data, research scripts or internal records (real student
# messages, labelling sheets, run results), which are not published. They run in the private repository.
addopts =
    --deselect tests/test_announcements.py::test_freeze_gate_requires_frozen_criteria_and_a_completed_review
    --deselect tests/test_announcements.py::test_freeze_gate_requires_reviewed_categories_to_be_applied
    --deselect tests/test_corpus_sources.py::test_combined_pool_is_the_pool_the_m12_experiments_use
    --deselect tests/test_corpus_sources.py::test_the_evaluated_15_document_pool_is_still_reproducible
    --deselect tests/test_ingest_pages.py::test_no_token_appears_in_the_record_the_run_file_or_the_output
    --deselect tests/test_ingest_pages.py::test_the_command_records_the_cutoff_once
    --deselect tests/test_ingest_pages.py::test_the_example_config_is_valid_and_includes_no_page
    --deselect tests/test_input_guard.py::test_every_development_message_passes_the_guard
    --deselect tests/test_m12_3_normalizer.py::NoOpCases::test_all_26_development_claims_are_noops
    --deselect tests/test_m85c_refresh.py::test_methodology_keeps_real_dyci_facebook_blocked
    --deselect tests/test_photo_check_api.py::test_the_default_index_folder_loads_and_holds_the_frozen_settings
    --deselect tests/test_question_form.py::test_reproduces_every_recorded_option_b_output
    --deselect tests/test_served_window.py::test_history_files_are_not_inputs_and_the_window_is_required
    --deselect tests/test_served_window.py::test_the_command_builds_a_file_the_checker_can_load
    --deselect tests/test_wrong_post.py::test_the_word_list_is_the_one_fixed_in_the_plan
